name: Build OpenWrt x86_64 (BTF)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone official OpenWrt v25.12.6
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --oneline

      - name: Update and install feeds (official only)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject .config
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/configs/x86_64-btf.config .config
          make defconfig

      - name: Verify BTF options are enabled
        run: |
          cd openwrt
          echo "=== BTF related config check ==="
          grep -E 'CONFIG_KERNEL_DEBUG_INFO|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_BTF|CONFIG_BPF_SYSCALL|CONFIG_KALLSYMS' .config || echo "(none found)"
          grep -q 'DEBUG_INFO_BTF=y' .config || (echo "ERROR: DEBUG_INFO_BTF not enabled" && exit 1)

      - name: Download source packages
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Verify built vmlinux has BTF
        run: |
          cd openwrt
          VMLINUX=$(find build_dir -name vmlinux | head -n 1)
          echo "vmlinux path: $VMLINUX"
          if [ -z "$VMLINUX" ]; then echo "ERROR: vmlinux not found"; exit 1; fi
          if strings "$VMLINUX" | grep -q '\.BTF'; then
            echo "OK: .BTF section found in vmlinux"
          else
            echo "WARNING: .BTF section not detected via strings"
          fi

      - name: List output images
        run: |
          cd openwrt
          ls -lh bin/targets/x86/64/
          ls -lh bin/targets/x86/64/packages/ || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-btf-images
          path: |
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.img
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/*.sha256sums
          if-no-files-found: error

      - name: Upload config for reference
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: |
            openwrt/.config
            openwrt/feeds.conf
          if-no-files-found: warn
